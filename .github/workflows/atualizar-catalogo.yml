name: Atualizar catálogo de marcadores

on:
  push:
    branches:
      - main
    paths:
      - "imagens/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/atualizar-catalogo.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-catalogo-marcadores
  cancel-in-progress: false

jobs:
  atualizar-catalogo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar token de publicação
        env:
          PUBLISH_TOKEN: ${{ secrets.MARCADORES_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::O segredo MARCADORES_PUBLISH_TOKEN não está disponível para este repositório."
            exit 1
          fi
          echo "Token de publicação encontrado."

      - name: Testar atualização do catálogo
        run: python -m unittest discover -s tests -v

      - name: Atualizar catálogo a partir de todas as imagens
        run: |
          # A varredura completa também atualiza metadados de arquivos já existentes
          # quando a lógica do workflow é aprimorada.
          python scripts/atualizar_catalogo.py

      - name: Salvar catálogo e acionar publicação do site
        env:
          PUBLISH_TOKEN: ${{ secrets.MARCADORES_PUBLISH_TOKEN }}
        run: |
          if git diff --quiet -- catalogo.js; then
            echo "Nenhuma alteração no catálogo."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.js
          git commit -m "Atualiza catálogo automaticamente"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 | tr -d '\n')"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH_HEADER"
          git push origin HEAD:main
